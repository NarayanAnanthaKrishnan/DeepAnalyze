name: keepalive

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render backend
        run: |
          set -eo pipefail
          BACKEND="${{ secrets.RENDER_BACKEND_URL || 'https://deepanalyze.onrender.com' }}"
          BACKEND="${BACKEND%/}"
          echo "Pinging $BACKEND/gate/status ..."
          for i in 1 2 3; do
            if curl -fsS --max-time 30 "$BACKEND/gate/status" | head -c 200; then
              echo ""
              echo "OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "All pings failed"
          exit 1
